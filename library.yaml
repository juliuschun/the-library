    tags:
    - internal
    risk:
      level: high
      can_send_external: true       # 운영자 승인 후 #tower 채널 webhook push 가능
      can_modify_files: false
      can_deploy: false
      uses_secrets: true            # customer VM SSH / room webhook token
    data_policy:
      handles_customer_data: true   # 고객 VM user 메시지
      stores_outputs: true          # 내부 청취 노트·개선 액션 문서
      external_api: false
