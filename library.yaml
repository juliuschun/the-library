default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/

# ═══════════════════════════════════════════════════
# Tower Skill Library — Profile-based Distribution
# ═══════════════════════════════════════════════════
#
# 3가지 제품 버전:
#   full       = Moat AI 내부 (모든 스킬 + 개발 도구 + 인프라 도구)
#   managed    = 고객 VM, 우리가 운영 (Docker/Neko 인프라 있음)
#   standalone = 고객 자체 설치·운영 (Docker 없을 수 있음)
#
# version 관리:
#   각 스킬의 version은 SKILL.md frontmatter의 version 필드와 동기화.
#   fleet deploy 시 고객 VM의 버전과 비교하여 변경분만 배포 가능.
#
# 고객 커스텀 스킬:
#   배포 시 .managed-manifest.json이 원격에 생성됨 (managed 스킬 목록 + 버전).
#   manifest에 없는 스킬 = 고객이 직접 만든 것 → deploy가 절대 건드리지 않음.
#   고객에게 프로젝트 스코프 스킬(.claude/skills/ in project)을 우선 안내하되,
#   전역 스킬 생성도 가능. --diff 명령으로 현황 파악.

# ─── Profiles ───
profiles:
  standalone:
    description: "고객 자체 운영 — 핵심 업무 도구만 (인프라 의존 없음)"
    tags: [core, business, docs]

  managed:
    description: "우리가 운영하는 고객 VM — standalone + 브라우저 + 프레젠테이션"
    tags: [core, business, docs, browser, presentation]

  full:
    description: "Moat AI 내부 — 전체 스킬"
    tags: [core, business, docs, browser, presentation, dev, meta, tower-ops, internal]

# ─── Customer Registry ───
customers:
  okusystem:
    profile: managed
    ssh: toweradmin@20.41.101.188
    domain: okusystem.moatai.app
    team_name: 오케이유시스템
    skills_dir: ~/.claude/skills/

# ═══════════════════════════════════════════════════
# Skill Catalog
