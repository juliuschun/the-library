default_dirs:
  skills:
  - default: .claude/skills/
  - global: ~/.claude/skills/
  agents:
  - default: .claude/agents/
  - global: ~/.claude/agents/
  prompts:
  - default: .claude/commands/
  - global: ~/.claude/commands/
profiles:
  standalone:
    description: 고객 자체 운영 — 핵심 업무 도구만 (인프라 의존 없음)
    tags:
    - core
    - business
    - docs
  managed:
    description: 우리가 운영하는 고객 VM — standalone + 브라우저 + 프레젠테이션 + 스킬 lifecycle
    tags:
    - core
    - business
    - docs
    - browser
    - presentation
    - meta            # skill-architect — customer 운영자도 스킬 작성·검증
    - tower-ops       # library — customer 운영자도 자기 VM 카탈로그 운영
    # 결정: workspace/decisions/2026-05-19-managed-profile-skill-lifecycle-tools.md
  full:
    description: Moat AI 내부 — 전체 스킬
    tags:
    - core
    - business
    - docs
    - browser
    - presentation
    - dev
    - meta
    - tower-ops
    - internal

# ─── Owners — 스킬·VM 의 소유 조직 (Phase B 옵션 B, 2026-05-05) ───
# 스킬 자산의 소유권을 명시. 미래 multi-tenant skill repository 의 토대.
# 결정: workspace/decisions/2026-05-02-skill-ui-role-split.md (갱신 #2)
#
# 현재는 메타데이터만 — 실제 배포 정책 (shareable, owner-aware deploy) 은 후속 결정.
owners:
  moat:
    display_name: "Moat AI"
    role: provider                # Tower 제공자 (자기 자신)
    description: "Tower 운영팀, 본 서버 (enterpriseai) 운영"
  okusystem:
    display_name: "오케이유시스템"
    role: tenant                  # Tower 도입 회사
    description: "첫 managed 고객사"

customers:
  tower-prod:
    owner: moat
    profile: internal
    ssh: null
    domain: tower.moatai.app
    team_name: Moat AI 내부
    skills_dir: ~/.claude/skills/
    current_version: 1.0.0
    version_last_checked: '2026-04-22T06:29:28Z'
    # 형제 sandbox VM (D12, 2026-05-02 의무화).
    # workspace/decisions/2026-05-02-execution-sandbox-d12-sibling-sandbox-mandatory.md
    sibling_execution:
      vm_name: execution-tower-vm
      resource_group: tower_execution
      public_ip: 20.194.63.1
      private_ip: 10.0.0.4
      ssh_alias: exec-tower      # ~/.ssh/config 에 정의된 alias
      ssh_user: toweradmin
      size: Standard_B1ms
      created_at: '2026-04-26'
      status: running             # 운영 중 ✅
  okusystem:
    owner: okusystem
    profile: managed
    ssh: toweradmin@20.41.101.188
    domain: okusystem.moatai.app
    team_name: 오케이유시스템
    skills_dir: ~/.claude/skills/
    current_version: 1.0.0
    version_last_checked: '2026-04-22T06:29:28Z'
    secrets:           # Names only — values live in customer VM's ~/claude-desk/.env
    - OPENAI_API_KEY # gpt-image-2, ppt-gen default provider
    - GEMINI_API_KEY # legacy ppt-gen + image edit fallback
    azure:
      resource_group: tower_customers
      vm_name: okusystem
      backup_vault: tower-backup-koreacentral
      backup_policy: DefaultPolicy
      backup_enrolled: true
      backup_layer1_cron: true
    # 형제 sandbox VM (D12) — 2026-05-04 신설 ✅
    sibling_execution:
      vm_name: execution-okusystem-vm
      resource_group: tower_execution
      public_ip: 20.196.213.144
      private_ip: 10.0.0.6
      ssh_alias: exec-okusystem  # okusystem 본체의 ~/.ssh/config 에 등록됨
      ssh_user: toweradmin
      size: Standard_B1ms
      created_at: '2026-05-04'
      status: running
      nsg_source_ip: 20.41.101.188/32   # okusystem 본체 IP 만 허용
      note: |-
        okusystem 본체 .env 에 ENABLE_SANDBOX=true + EXECUTION_VM_HOST=exec-okusystem
        활성화됨. [sandbox] enabled 로그 검증됨. 단 코드 gate (claude-engine.ts 의
        towerRole === 'full' 조건) 가 아직 managed 차단 — Phase 2a 의 작업 잔여.
        활성 후엔 AI가 도구 mount 받음.
  demo-tower:
    owner: moat
    profile: managed
    ssh: toweradmin@20.200.217.16
    domain: demo-tower.moatai.app
    team_name: Demo
    skills_dir: ~/.claude/skills/
    current_version: 1.0.0
    version_last_checked: '2026-04-22T06:29:28Z'
    secrets:
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    azure:
      resource_group: tower_customers
      vm_name: demo-tower
      backup_vault: tower-backup-koreacentral
      backup_policy: DefaultPolicy
      backup_enrolled: true
      backup_layer1_cron: false
    # 형제 sandbox VM (D12) — 이미 신설됨 ✅
    sibling_execution:
      vm_name: execution-demo-tower-vm
      resource_group: tower_execution
      public_ip: 20.200.220.217
      private_ip: 10.0.0.5
      ssh_alias: null               # demo-tower 본체에 alias 추가 필요
      ssh_user: toweradmin
      size: Standard_B1ms
      created_at: '2026-04-30 (auto-detected, manual creation date approximate)'
      status: running
      note: |-
        demo-tower 의 .env 에 EXECUTION_VM_HOST 활성 + ssh config 추가 작업 필요.
        Q15 (fleet sandbox 통합) 완성 시 자동화 예정.
